<div class="container" style="max-width: 420px;">
  <div class="card">
    <h2>Reset password</h2>
    <p class="muted">
      This is a minimal build with no email server, so your reset token was carried over
      automatically. In production, this token would arrive by email instead.
    </p>
    <form (ngSubmit)="onSubmit()">
      <label>
        Reset token
        <input type="text" [(ngModel)]="token" name="token" required />
      </label>
      <label>
        New password
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="6" />
      </label>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Updating...' : 'Update password' }}
      </button>
    </form>
    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="success">{{ success }}</p>
    <p class="muted" style="margin-top:16px;">
      <a routerLink="/login">Back to log in</a>
    </p>
  </div>
</div>
